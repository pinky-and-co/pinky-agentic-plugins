# Generated by pinky-bootstrap (`pinky repo distribute`): overwritten on every distribution, do not
# edit. A need specific to one repo goes in a workflow file of its own, next to this one.

name: CI

# Les TESTS gardent une porte : celle de la PR. L'événement `pull_request` de GitHub teste déjà
# l'arbre FUSIONNÉ (`refs/pull/N/merge`), donc rejouer la CI sur le `push` qui suit le merge revient
# à revalider ce que la PR vient de valider — mesuré le 2026-08-09 : 32 des 60 derniers runs étaient
# des `push develop`, soit 53 % du budget en doublons.
#
# Le `push` survit sur les deux seuls chemins que `branch.md` autorise en direct sur `develop` et qui
# peuvent réellement casser la suite : les métadonnées du paquet et les workflows eux-mêmes. Un
# commit direct de docs ne déclenche plus rien ici — il passe quand même par tous les hooks, via
# prek.yml, qui lui reste sur `push`.
on:
  push:
    branches: [main, develop]
    paths:
      - "pyproject.toml"
      - ".github/**"
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Explicite, alors que le défaut d'org est déjà `read` : ce défaut est un réglage
    # d'organisation, invisible du fichier et modifiable sans toucher aucun repo. Le déclarer ici
    # rend le workflow immunisé si ce défaut repasse un jour en `write` (règle CodeQL
    # actions/missing-workflow-permissions, 14 alertes sur l'org au scan 2026-07-25).
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Une PR dont TOUS les fichiers sont de la documentation ne change rien que les tests lisent :
      # installation, audit et tests sautent (`if` sur chaque étape), pendant que le JOB tourne et
      # se rapporte — un check `ci` requis qui n'apparaît jamais bloque la fusion pour toujours
      # (pas de `paths:` sur `pull_request`, pas de `if:` sur le job). La liste se lit sur la PR
      # ENTIÈRE (base...head), jamais sur le dernier commit : du code suivi d'un commit de doc reste
      # une PR de code. Un renommage compte deux fois (ancien et nouveau nom) : du code déplacé vers
      # `docs/` n'est pas de la documentation. Au-delà de 300 fichiers l'API tronque sa liste, et un
      # appel en échec n'en donne aucune : dans les deux cas les tests tournent. Sous `docs/`, seules
      # les extensions de documentation comptent — un script ou une config rangés là pilotent un
      # comportement. Liste dupliquée exprès (branch_paths.sh de pc-git, prek.yml.tpl) : une
      # divergence ne coûte qu'un run de trop, jamais un trou. Un `push` lance toujours les tests.
      - name: Détecter une PR de documentation seule
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null || true)
            total=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
            if [ -n "$files" ] && [ "$total" -lt 300 ] \
              && ! grep -qvE '^(README\.md|AGENTS\.md|CLAUDE\.md|LICENSE|(plugins/[^/]+/)?(README\.md|docs/.+\.(md|rst|txt|docx|xlsx|pptx|pdf|png|jpg|jpeg|gif|svg)))$' <<<"$files"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "PR de documentation seule : $docs_only"

      - name: Set up Python 3.12
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.scope.outputs.docs_only != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        # `--locked`, pas `--frozen` : échoue si `uv.lock` est désynchronisé du `pyproject.toml`
        # (dépendance ajoutée sans relancer `uv lock`) au lieu d'installer un lock potentiellement
        # obsolète en silence — `pip install` ignorait totalement `uv.lock` (chantier 0024).
        # `--no-sources` : ignore `[tool.uv.sources]` (override dev vers un repo frère en chemin
        # relatif, ex. `../pinky-core`) — la CI checkout un seul repo, isolé, ce chemin n'existe
        # pas. `pip install` ignorait déjà `[tool.uv.sources]` (mécanisme propre à uv), donc
        # retombait silencieusement sur le paquet publié ; `uv sync` l'honore et casse sans ce
        # flag (mesuré : "Distribution not found" sur pinky-connect en CI réelle). Résout contre
        # le contrat publié, ce que teste une CI est censée valider de toute façon.
        # --group dev, pas ".[dev]" : les deps de dev sont un dependency-group PEP 735 depuis
        # 2026-07-22 (voir le commentaire dans pyproject.toml — `uv run` désinstallait les extras).
        run: uv sync --locked --no-sources --group dev

      - name: Audit dependencies
        if: steps.scope.outputs.docs_only != 'true'
        # `uv run pip-audit`/`uvx pip-audit` seuls auditent un env d'outil ISOLÉ (~29 paquets de
        # pip-audit lui-même), jamais les deps du projet — un scan vert qui ne prouve rien (mesuré
        # sur pinky-core, chantier 0024). L'export force pip-audit à lire le VRAI arbre résolu.
        # Bloquant : une CVE détectée fait échouer le job. Un scan qui ne bloque rien n'est qu'un
        # log de plus, ignoré comme tout log jusqu'à l'incident.
        # --disable-pip --no-deps : l'export est entièrement épinglé, on audite le lock tel quel.
        # pip re-résoudrait les bornes des paquets et rejetterait un `override-dependencies` d'uv.
        run: |
          uv export --frozen --all-extras --all-groups --format requirements-txt --no-hashes -o /tmp/pip-audit-requirements.txt
          uvx pip-audit --disable-pip --no-deps -r /tmp/pip-audit-requirements.txt

      - name: Tests
        if: steps.scope.outputs.docs_only != 'true'
        # Commande surchargeable : `pytest` ne convient qu'aux repos dont la suite est en Python.
        # PILOT teste ses calculs monétaires en JavaScript — un `pytest` y sort « aucun test
        # collecté », et la commande n'est même pas installée. Cette étape existe en plus du hook
        # `run-tests` parce que celui-ci est filtré sur `files: ^(src|tests)/` : une PR qui ne
        # touche que la doc le saute, et la suite ne tourne alors volontairement nulle part (voir la
        # détection de PR de documentation seule, plus haut).
        # `uv run`, pas la commande nue : depuis `uv sync --locked` (chantier 0024), les paquets
        # vivent dans le venv géré par uv, plus dans le Python système comme avec `pip install` —
        # un `pytest` nu sort "command not found" (mesuré en CI réelle, Linux et Windows).
        # `--no-sources` : `uv run` resynchronise l'environnement AVANT de lancer la commande, avec
        # la config par défaut du repo — donc `[tool.uv.sources]` si le repo en a un, qui casse en
        # CI isolée exactement comme l'étape d'install (mesuré : pinky-ai PR#9, "Distribution not
        # found" ici, pas à l'install). No-op sur un repo sans `[tool.uv.sources]`.
        run: uv run --no-sources pytest
