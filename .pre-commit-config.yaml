---
# =============================================================================
# .pre-commit-config.yaml — GENERATED by pinky-workspace/setup.py — DO NOT EDIT
# =============================================================================
# Source: pinky-workspace/core/pre-commit/{base,extras/*}.yaml
# Third-party revs are pinned centrally in this base — bump them here, once.
# To change which hooks a repo gets, edit the workspace source and re-run setup.py.
#
# Install (done automatically by setup.py):
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
# =============================================================================
default_install_hook_types: [pre-commit, commit-msg]
# Pin explicite : sans ça, les hooks `language: python` (mdformat, mypy, interrogate, darglint…)
# créent leur venv avec le python3 ambiant du PATH au moment de l'install, pas une version garantie
# par le repo — non-déterministe en local (CI est protégée par actions/setup-python en amont).
#
# Règle (2026-07-22) : tout hook `repo: local` dont l'`entry` commence par `python` DOIT être
# `language: python`, jamais `language: system`. `system` exécute la commande telle quelle dans le
# shell, et `python` nu n'existe ni sur macOS hors conda (homebrew ne pose que `python3`) ni sur une
# machine Windows vanilla — ça ne marchait que par l'auto-activation de conda base. Avec
# `language: python`, prek provisionne l'interpréteur (et le télécharge s'il manque) et met le bin/
# de son venv en tête du PATH : `python` y est garanti sur les trois OS. Les scripts de
# scripts/hooks/ étant 100 % stdlib, ils partagent tous un seul venv (dédupliqué par langage +
# version + additional_dependencies) — coût quasi nul.
default_language_version:
  python: python3.12

repos:
  # ── Formatting: trailing spaces + newline ─────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^docs/reference/generated/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # ── Docs generation: README + docs/index.md + quality badges ──────────────
  # Universal (every repo, not just the snowflake extra — 2026-07-10, renamed/extended from
  # check-docs-up-to-date). Runs before mdformat below so the regenerated README gets reformatted.
  - repo: local
    hooks:
      - id: generate-docs
        name: Generate docs (README + index.md + badges)
        entry: scripts/hooks/generate-docs
        language: script
        stages: [pre-commit]
        pass_filenames: false

  # ── Test suite: the blocking quality gate ─────────────────────────────────
  # Universal, NOT the `python` extra (moved 2026-07-25, same day it was introduced). The first
  # placement rested on an unverified assumption — "the repos outside the python extra have no test
  # suite". Measured: pinky-workspace, the engine itself, carries 25 test files / 264 tests, and
  # pinky-studio carries tests with NO CI at all. Only assets/infra have no tests/ directory, and
  # the hook's own `[ -d tests ]` guard makes those a real no-op.
  #
  # Before this hook, the only test execution at commit time was the one buried inside generate-docs
  # feeding the coverage badge, whose failure printed a warning and returned 0 — a broken suite
  # passed pre-commit. generate-docs keeps its own run for the badge data and stays non-blocking;
  # this hook owns the verdict. See core/hooks/run-tests for why the two runs stay independent, and
  # why an absent pytest warns instead of blocking.
  - repo: local
    hooks:
      - id: run-tests
        name: "[TESTS] Suite must pass"
        entry: scripts/hooks/run-tests
        language: script
        # PAS de `files:` — retiré le 2026-08-07. Il valait `^(src|tests)/`, c'est-à-dire une
        # ALLOWLIST DE LAYOUTS : elle énumérait les arborescences connues, donc elle était fausse par
        # défaut pour toute autre. Le moteur lui-même en était la preuve — son code vit dans `setup/`,
        # que ce motif n'a jamais matché : aucun commit ne touchant que `setup/*.py` n'a lancé la
        # suite. Même trou côté repos data (`resources/`), et côté n'importe quel paquet Python en
        # flat layout, qui est un layout parfaitement valide (la PyPA documente `src/` et flat comme
        # deux options).
        #
        # Élargir le motif aurait reproduit le défaut une arborescence plus loin. Le supprimer rend le
        # portier correct PAR CONSTRUCTION : `scripts/hooks/run-tests` détecte déjà les suites
        # lui-même (pytest sur `tests/`, `npm test` ou `node --test` sur les signaux JS) et sort en 0
        # quand il n'y en a aucune. Le filtre ne garantissait rien — il ne faisait que décider QUAND
        # invoquer un script qui sait déjà ne rien faire.
        #
        # Coût assumé : un commit de documentation seule lance la suite. C'est le prix d'un portier
        # qui ne peut plus rater un layout, et il est visible — un portier qui ne se déclenche pas ne
        # l'est pas.
        pass_filenames: false
        stages: [pre-commit]

  # ── Formatting: Markdown ──────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: mdformat
        language: python
        additional_dependencies: ["mdformat==1.0.0"]
        files: ^README\.md$

  # ── Security: secrets & forbidden files ──────────────────────────────────
  # gitleaks' hook has pass_filenames: false (it scans the repo itself, not a file list pre-commit
  # hands it) — a pre-commit `exclude:` here would be silently inert. The real exclusion mechanism
  # is the distributed .gitleaks.toml allowlist (see distribute()/DISTRIBUTED_PATHS): .secrets.baseline
  # stores detect-secrets' accepted findings as SHA1 hashes, never the raw secret, but a high-entropy
  # hash next to a "secret"-shaped key still trips gitleaks' generic-api-key heuristic (found rolling
  # this out to pinky-studio, the first repo whose baseline had a real finding instead of an empty
  # result set).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Security: alternative secret detection ────────────────────────────────
  # pylock.toml is excluded for the same reason uv.lock needs no exclusion: it is a lock file full of
  # wheel SHA-256 digests, which read as "hex high entropy strings". detect-secrets has a filter for
  # exactly this (heuristic.is_lock_file) but it matches a hardcoded list of names — package-lock.json,
  # poetry.lock, uv.lock… — and pylock.toml, produced by pywrangler when bundling a Python Worker,
  # is not on it. Found the first time a repo here shipped a Python Worker (2026-07-31); it will hit
  # every such repo, hence the fix here rather than a baseline entry per repo — a baseline would
  # also have to be re-audited on every dependency bump.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(docs/|pylock\.toml$)

  # ── Zero-width spaces (copy-paste from Outlook/Teams) ────────────────────
  - repo: local
    hooks:
      - id: check-zws
        name: "[ZWS] Invisible characters (zero-width)"
        entry: python scripts/hooks/check_zws.py
        language: python
        pass_filenames: true

  # ── Employer reference guard ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: check-forbidden-keywords
        name: "[FORBIDDEN] Employer references"
        entry: python scripts/hooks/check_forbidden_keywords.py
        language: python
        pass_filenames: true

  # ── Commit message format ─────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: commit-msg-format
        name: Commit message format
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]

  # ── EXTRA python — repos with a pyproject.toml ────────────────────────────
  # `files:`/`args:` below are placeholders (__PY_LINT_*__), resolved per repo by
  # `build_precommit_config` from `_py_lint_roots()` — `src/` when present (the common case,
  # renders byte-identical to the historical hardcoded `^src/`), otherwise every top-level dir/file
  # this repo actually owns .py in, minus scripts/hooks/ and tests/. Self-adjusting by construction
  # — see `_py_lint_roots`'s own docstring for why (same principle as `run-tests`' file-scoping,
  # base.yaml).
  # Python: ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
        args: [--no-fix]
      - id: ruff-format
        args: [--check]

  # Python: type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        # Hermetic (ADR-0026, supersedes ADR-0023's system carve-out): additional_dependencies is
        # auto-derived per repo by setup.py (build_precommit_config) from THAT repo's own
        # pyproject.toml runtime `dependencies` — mypy pin + real third-party deps, minus internal
        # pinky-* packages (pre-release, not on PyPI, excluded from the derivation).
        # --ignore-missing-imports stays as the residual fallback for those excluded imports only.
        language: python
        additional_dependencies: ["mypy==2.0.0"]
        types: [python]
        args: [--ignore-missing-imports]
        files: ^plugins/
        # Temporary exclude (card `remonter-seuil-interrogate-70-vers-80`, chantier 0024) — same
        # story as check-typed-api below: these paths only exist in pinky-bootstrap's flat layout,
        # inert on every src/ repo. Turning mypy on for real for the first time on this repo's own
        # code surfaced 6 pre-existing type errors — real debt, deferred rather than blocking.
        # (2 of the 6, in render_docs.py, are fixed inline with `# type: ignore[arg-type]` instead
        # of excluded here — mypy follows the import from setup/common.py regardless of `exclude:`,
        # so a file-level exclude is silently ineffective on anything reachable via import.)
        exclude: ^(cli_pinky\.py|hygiene/hooks/(check_zws|check_typed_api)\.py)$
        # mypy's incremental cache (.mypy_cache/) isn't safe under concurrent access — without
        # this, prek/pre-commit's default file-batch parallelism spawns multiple mypy processes
        # against the same cache dir and one crashes with INTERNAL ERROR (reproduced on
        # pinky-core: a single-process run over the same files passes clean).
        require_serial: true

  # Python: security
  # B108 (hardcoded /tmp) is skipped workspace-wide: Snowflake execution only exposes
  # /tmp as a writable scratch directory, so it is the sanctioned path, not a smell.
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        pass_filenames: false
        args: [-r, plugins/, -ll, --skip, B108]
        # `files:` — see the identical line on interrogate below for why this matters even with
        # `pass_filenames: false` (which only controls what gets PASSED, not whether the hook runs
        # at all).
        files: ^plugins/

  # Docstrings: coverage
  - repo: local
    hooks:
      - id: interrogate
        name: "[DOCSTRING] Coverage"
        entry: interrogate
        language: python
        additional_dependencies: ["interrogate==1.7.0"]
        pass_filenames: false
        args: [plugins/, --ignore-init-method, --ignore-magic, --ignore-module, --ignore-private]
        # Without a `files:` gate, the hook runs on EVERY commit regardless of what changed
        # (pass_filenames: false + no files:/types: filter = pre-commit's default "matches
        # everything"), always invoking `interrogate <targets> ...` literally. interrogate's CLI
        # also validates its target paths with click's `Path(exists=True)` — a hard-error (exit 2)
        # on a target that does not exist, not a clean skip like mypy/bandit get from an empty
        # `files:` match. `_py_lint_roots` never emits a nonexistent target (it only lists what it
        # found on disk), so this can no longer fire.
        files: ^plugins/

  # Docstrings: args/returns match signature
  #
  # PAS de `--strictness` : le DÉFAUT de darglint est `long`, et c'est exactement le comportement
  # voulu — une description d'une ligne ou de dix passe sans sections, mais dès qu'une section
  # `Args:`/`Returns:` est ouverte elle doit être complète.
  #
  # Un `--strictness=short` avait été ajouté le 2026-07-31 pour obtenir cette propriété, sur la
  # croyance que le défaut était `full`. FAUX, mesuré le 2026-08-06 sur `pinky_snowpark/xml.py` :
  # long = 0 erreur · défaut = 0 · short = 3 · full = 5. `short` est plus STRICT que le défaut pour
  # une docstring en prose — il exige des sections dès que la description dépasse une ligne. Le flag
  # resserrait donc ce qu'il prétendait relâcher. Jamais distribué, il n'avait jamais mordu ; il a
  # cassé les CI de pinky-snowpark (3) et pinky-connect (62) le jour de sa distribution.
  #
  # Troisième niveau de l'erreur, et le plus parlant : chaque repo porte déjà un `.darglint` qui
  # déclare `strictness = long`. Un flag CLI ÉCRASE ce fichier. Le socle n'a donc pas à trancher
  # cette valeur — le repo l'a déjà fait, et il a raison. Règle qui en découle : ne pas passer en
  # ligne de commande ce qu'un fichier de config du repo possède.
  - repo: local
    hooks:
      - id: darglint
        name: "[DOCSTRING] Args/Returns match"
        entry: darglint
        language: python
        additional_dependencies: ["darglint==1.8.1"]
        types: [python]
        files: ^plugins/

  # Typed API guard
  - repo: local
    hooks:
      - id: check-typed-api
        name: "[TYPED-API] No raw dict/tuple/set in public annotations"
        entry: python scripts/hooks/check_typed_api.py
        language: python
        types: [python]
        files: ^plugins/
        # Temporary exclude (card `remonter-seuil-interrogate-70-vers-80`, chantier 0024) — these
        # paths only exist in pinky-bootstrap's flat layout, inert on every src/ repo. Turning the
        # `python` extra's src/-scoped hooks on for real for the first time on this repo's own
        # `setup/`/`hygiene/` (the `_py_lint_roots` fix) surfaced 11 pre-existing raw dict/tuple/set
        # findings across these files — real debt, not a false positive, deferred rather than
        # blocking every future commit while it gets backfilled.
        exclude: ^(setup/(plugin_install|rules|plugin_reconcile|doctor)\.py|hygiene/hooks/(validate_plugins_strict|check_snowpark_api|render_docs)\.py)$

  # Weak-assertion ratchet — first hook to target tests/, not src/ (tests.md § generator oracle).
  # Blocks a fragment `assert "x" in <generator(...)>` that has no whole-output equality oracle in
  # the same file. Narrow by design (name-matched generators only) so it stays at ~0 flags.
  - repo: local
    hooks:
      - id: check-weak-assertions
        name: "[WEAK-ASSERT] Generated-output assertion needs an equality oracle"
        entry: python scripts/hooks/check_weak_assertions.py
        language: python
        types: [python]
        files: ^tests/

  # ── EXTRA plugin-repo — repos shipping a Claude Code plugin (.claude-plugin/) ────────────
  # Validates the artefacts a plugin repo ships that base.yaml has no schema for: SKILL.md /
  # agent frontmatter, and the legacy commands/*.md format this convention replaces (a hard
  # failure, not a missing-type gap — see the script's own docstring). Distinct from the
  # commit-msg convention (already universal via base.yaml's `commit-msg-format`) and from
  # python-lint's ruff pass (unaffected, still applies independently — this extra is additive).
  - repo: local
    hooks:
      - id: validate-frontmatter
        name: "[FRONTMATTER] SKILL.md / agent schema, no legacy commands/"
        entry: python scripts/hooks/validate_frontmatter.py
        language: python
        files: \.md$
        stages: [pre-commit]

  # `claude plugin validate --strict` on every plugin.json + marketplace.json this repo ships —
  # card `declarer-dependencies-plugin-et-valider-strict.md` (chantier 0023): the dependency between
  # `pc-priv-snow` and `pc-snow` existed only as prose in a `description` string until the CLI grew
  # a native `dependencies` field (2026-08-22) — nothing enforced the field's *shape* at commit time.
  - repo: local
    hooks:
      - id: validate-plugins-strict
        name: "[PLUGIN] claude plugin validate --strict"
        entry: python scripts/hooks/validate_plugins_strict.py
        language: python
        files: (plugins/[^/]+/\.claude-plugin/plugin\.json|\.claude-plugin/marketplace\.json)$
        pass_filenames: false
        stages: [pre-commit]

  # Card `decouper-pc-core-en-pc-git-et-pc-kanban.md` (chantier 0023): a plugin split across two
  # plugins can vendor a small shared utility (policy_lib, secret_patterns, plugin_scope_lib,
  # pending_user_action) since neither plugin can import the other's files at runtime. This hook
  # catches a hand-edited copy drifting from the pinky-bootstrap source instead of letting the next
  # `pinky distribute` silently overwrite it.
  - repo: local
    hooks:
      - id: check-vendor-checksum
        name: "[VENDOR] Vendored file matches its source checksum"
        entry: python scripts/hooks/check_vendor_checksum.py
        language: python
        files: \.vendor-manifest\.json$|(hooks|scripts)/(pc_git_policy_lib|pc_kanban_secret_patterns|pc_kanban_plugin_scope_lib|pc_kanban_pending_user_action|policy_lib|secret_patterns|plugin_scope_lib|pending_user_action)\.py$
        pass_filenames: false
        stages: [pre-commit]

  # No mypy/bandit/interrogate/darglint/check-typed-api here any more: they were a narrower copy
  # (`^plugins/[^/]+/(hooks|mcp)/`) of the `python` extra's src/-scoped hooks, added while that extra
  # was hardcoded to `^src/` and therefore inert on a `plugins/` layout. Since `_py_lint_roots`
  # derives the scope (2026-09), the `python` extra resolves to `^plugins/` for a plugin repo — a
  # strict superset that also covers `skills/<name>/scripts/` — so this copy was pure duplication
  # (every hook ran twice per commit) and its `bandit` was the one place workspace-wide `--skip B108`
  # did not apply. Assumption: a plugin repo carries a `pyproject.toml` (both do today), which is
  # what activates the `python` extra; a future plugin repo without one would get `python-lint`
  # (ruff only) and need this revisited.
