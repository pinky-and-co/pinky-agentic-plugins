[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinky-agentic-plugins"
# No install-time value: nobody `pip install`s a Claude Code plugin (`claude plugin install` does,
# from marketplace.json — see pinky-workspace's own decision NOT to publish to PyPI, ADR-0065
# decision 5, same reasoning). This pyproject.toml exists purely so setup.py's distribute() can
# derive a Python version pin and generate a real ci.yml (mirrors pinky-workspace's own pyproject.toml
# — same reason it isn't a src/ layout: scripts/hooks/ and plugins/*/hooks/ are read by path at
# runtime, not imported as a package, same as pinky-workspace's core/ and providers/).
version = "0.1.0"
description = "Public Claude Code plugin marketplace — generic, reusable workspace mechanics: git workflow, kanban, session-hygiene hooks, engineering conventions."
requires-python = ">=3.12"
authors = [{ name = "Pinky & Co" }]

[dependency-groups]
# pytest + the pc-privacy Presidio stack (mcp, presidio, openpyxl, and the French spaCy model as
# a direct-URL wheel) so the Presidio-gated tests run in CI instead of skipping; prek still
# provisions its own hooks (ruff/mypy/bandit/interrogate/darglint) hermetically, untouched by
# this group.
dev = [
    "pytest",
    "mcp",
    "presidio-analyzer",
    "presidio-anonymizer",
    "openpyxl",
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
    "pyarrow>=25.0.1",
    "pytest-xdist>=3.8.0",
]

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
required-version = ">=0.9.17"
# Fenêtre de cooldown (chantier 0024) : `uv lock` ignore tout paquet publié depuis moins
# de 3 jours — protège la résolution contre une dépendance fraîchement compromise
# republiée sur PyPI. Durée relative : uv la résout au lock, `grep exclude-newer-span
# uv.lock` dit la fenêtre appliquée. Posée par `pinky repo distribute`, jamais éditée à la main.
exclude-newer = "3 days"
# presidio-anonymizer caps `cryptography<49`, whose releases carry known advisories (PKCS#7,
# X.509 path building, DNS name constraints) that the dependency audit rejects. Nothing here uses
# presidio's encrypt operator, so the cap is overridden rather than ignored.
# `filelock<4.2.1` and `setuptools<84.1.0` carry CVE-2026-112940 / GHSA-xmj3-9gf7-h52w and no
# parent has moved yet — floored until they do.
override-dependencies = ["cryptography>=50.0.0", "filelock>=4.2.1", "setuptools>=84.1.0"]

# No package to build (see the `[project]` comment) — bypass-selection tells hatchling not to
# error looking for one, so `pip install -e . --group dev` still succeeds (it only needs to land
# pytest in the environment for the Tests step of ci.yml).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
cache_dir = ".cache/mypy"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
# Les tests `integration` appellent un vrai compte Snowflake en lecture seule : exclus par défaut
# (le CI n'a pas d'identifiants), lancés par `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: appels en lecture seule sur la connexion Snowflake par défaut"]
